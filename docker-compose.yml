services:
  pdfexel-api:
    build: .
    ports:
      - "8133:8080"
    environment:
      - PDF_STAND_URL=http://host.docker.internal:8131/parse
      - JSON_STAND_URL=http://host.docker.internal:8132/convert
      - STAND_TIMEOUT_S=120
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
