services:
  pdfexel-api:
    build: .
    ports:
      - "8133:8080"
    environment:
      - PDF_STAND_URL=http://host.docker.internal:8131/parse
      - JSON_STAND_URL=http://host.docker.internal:8132/convert
      - STAND_TIMEOUT_S=240
      - JOBS_DIR=/data/jobs
      - SMTP_HOST=${SMTP_HOST:-mail.antonbutov.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-mail@antonbutov.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-mail@antonbutov.com}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-1}
      - AUTH_SECRET=${AUTH_SECRET:-}
    volumes:
      - /var/lib/pdfexel/jobs:/data/jobs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
